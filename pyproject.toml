[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spinup-dl"
version = "0.1.0"
description = "Companion code for Spinning Up in Deep Learning: standalone PyTorch implementations of core deep learning models."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "AUB Frontier AI Fellows" }]
dependencies = [
    "torch>=2.2",
    "torchvision>=0.17",
    "numpy>=1.24",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["spinup_dl*"]

[tool.setuptools.package-data]
spinup_dl = ["pretrained.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
