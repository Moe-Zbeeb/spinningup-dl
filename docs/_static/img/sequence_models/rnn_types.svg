<title id="t">Types of recurrent neural network architectures</title>
<desc id="d">Five small diagrams: one to one with a single input and output; one to many with one input and four outputs; many to one with four inputs and one output at the end; many to many with an output at every input; and an encoder-decoder with three inputs followed by three outputs.</desc>
