<rect x="148" y="104" width="116" height="44" rx="8" fill="#eef6fb" stroke="#404452" stroke-width="1.8"/>
<text x="206.0" y="131.2" font-family="Lato, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#000" text-anchor="middle">0</text>
<text x="206" y="172" font-family="STIX Two Text, Latin Modern Roman, Times New Roman, Times, serif" font-size="17" font-style="italic" fill="#000" text-anchor="middle">y<tspan font-size="11" dy="-6">⟨2⟩</tspan></text>
