<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 186" role="img" aria-labelledby="t d">
<title id="t">Inputs and labels for a named entity recognition example</title>
<desc id="d">The sentence Layla and Karim visited Beirut in March, one word per box labeled x 1 to x 7, with a label below each word: 1 under Layla and Karim, which are people's names, and 0 under every other word.</desc>
<text x="78" y="28" font-family="STIX Two Text, Latin Modern Roman, Times New Roman, Times, serif" font-size="17" font-style="italic" fill="#000" text-anchor="middle">x<tspan font-size="11" dy="-6">⟨1⟩</tspan></text>
<rect x="20" y="40" width="116" height="44" rx="8" fill="#ffffff" stroke="#404452" stroke-width="1.8"/>
<text x="78.0" y="67.2" font-family="Lato, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#000" text-anchor="middle">Layla</text>
<rect x="20" y="104" width="116" height="44" rx="8" fill="#fbeef2" stroke="#840132" stroke-width="1.8"/>
<text x="78.0" y="131.2" font-family="Lato, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#000" text-anchor="middle">1</text>
<text x="78" y="172" font-family="STIX Two Text, Latin Modern Roman, Times New Roman, Times, serif" font-size="17" font-style="italic" fill="#000" text-anchor="middle">y<tspan font-size="11" dy="-6">⟨1⟩</tspan></text>
<text x="206" y="28" font-family="STIX Two Text, Latin Modern Roman, Times New Roman, Times, serif" font-size="17" font-style="italic" fill="#000" text-anchor="middle">x<tspan font-size="11" dy="-6">⟨2⟩</tspan></text>
