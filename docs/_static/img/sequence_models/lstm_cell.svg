<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 870 370" role="img" aria-labelledby="t d">
<title id="t">The LSTM cell</title>
<desc id="d">The memory cell c runs straight across the top. The forget gate multiplies the old memory, the update gate times the candidate is added to it, giving the new memory. The new memory goes through tanh and is multiplied by the output gate to give the activation a. All four gates read the previous activation and the current input.</desc>
