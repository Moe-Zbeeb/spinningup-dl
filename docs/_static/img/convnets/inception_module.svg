<title id="t">An inception module</title>
<desc id="d">The previous activation feeds four parallel branches: a 1 by 1 convolution; a 1 by 1 convolution followed by a 3 by 3 convolution; a 1 by 1 convolution followed by a 5 by 5 convolution; and a 3 by 3 max pool followed by a 1 by 1 convolution. Their outputs are concatenated along the channels.</desc>
