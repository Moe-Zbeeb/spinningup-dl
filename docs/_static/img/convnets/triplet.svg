<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 290" role="img" aria-labelledby="t d">
<title id="t">Triplet loss</title>
<desc id="d">An anchor image, a positive image of the same person, and a negative image of another person go through the same ConvNet. In the space of encodings, the positive's encoding is close to the anchor's and the negative's is far away, outside a dashed circle.</desc>
<rect x="10" y="30" width="130" height="50" rx="8" fill="#eef6fb" stroke="#404452" stroke-width="1.8"/>
<text x="75.0" y="60.2" font-family="Lato, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#000" text-anchor="middle">Anchor A</text>
<line x1="140" y1="55" x2="190.0" y2="55.0" stroke="#404452" stroke-width="1.8"/>
<path d="M200.0 55.0 L190.0 60.0 L190.0 50.0 z" fill="#404452"/>
<rect x="200" y="30" width="170" height="50" rx="8" fill="#ffffff" stroke="#404452" stroke-width="1.8"/>
<text x="285.0" y="60.2" font-family="Lato, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#000" text-anchor="middle">same ConvNet</text>
<line x1="370" y1="55" x2="420.0" y2="55.0" stroke="#404452" stroke-width="1.8"/>
<path d="M430.0 55.0 L420.0 60.0 L420.0 50.0 z" fill="#404452"/>
<rect x="430" y="30" width="90" height="50" rx="8" fill="#ffffff" stroke="#404452" stroke-width="1.8"/>
<text x="475.0" y="60.2" font-family="Lato, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#000" text-anchor="middle">f(A)</text>
<rect x="10" y="120" width="130" height="50" rx="8" fill="#e3f4ee" stroke="#404452" stroke-width="1.8"/>
<text x="75.0" y="150.2" font-family="Lato, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#000" text-anchor="middle">Positive P</text>
<line x1="140" y1="145" x2="190.0" y2="145.0" stroke="#404452" stroke-width="1.8"/>
<path d="M200.0 145.0 L190.0 150.0 L190.0 140.0 z" fill="#404452"/>
<rect x="200" y="120" width="170" height="50" rx="8" fill="#ffffff" stroke="#404452" stroke-width="1.8"/>
<text x="285.0" y="150.2" font-family="Lato, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#000" text-anchor="middle">same ConvNet</text>
<line x1="370" y1="145" x2="420.0" y2="145.0" stroke="#404452" stroke-width="1.8"/>
<path d="M430.0 145.0 L420.0 150.0 L420.0 140.0 z" fill="#404452"/>
<rect x="430" y="120" width="90" height="50" rx="8" fill="#ffffff" stroke="#404452" stroke-width="1.8"/>
<text x="475.0" y="150.2" font-family="Lato, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#000" text-anchor="middle">f(P)</text>
<rect x="10" y="210" width="130" height="50" rx="8" fill="#fbeef2" stroke="#404452" stroke-width="1.8"/>
<text x="75.0" y="240.2" font-family="Lato, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#000" text-anchor="middle">Negative N</text>
<line x1="140" y1="235" x2="190.0" y2="235.0" stroke="#404452" stroke-width="1.8"/>
<path d="M200.0 235.0 L190.0 240.0 L190.0 230.0 z" fill="#404452"/>
<rect x="200" y="210" width="170" height="50" rx="8" fill="#ffffff" stroke="#404452" stroke-width="1.8"/>
<text x="285.0" y="240.2" font-family="Lato, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#000" text-anchor="middle">same ConvNet</text>
<line x1="370" y1="235" x2="420.0" y2="235.0" stroke="#404452" stroke-width="1.8"/>
<path d="M430.0 235.0 L420.0 240.0 L420.0 230.0 z" fill="#404452"/>
<rect x="430" y="210" width="90" height="50" rx="8" fill="#ffffff" stroke="#404452" stroke-width="1.8"/>
<text x="475.0" y="240.2" font-family="Lato, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#000" text-anchor="middle">f(N)</text>
<rect x="580" y="20" width="400" height="250" rx="10" fill="#fafafa" stroke="#404452" stroke-width="1.2"/>
<circle cx="700" cy="150" r="95" fill="none" stroke="#8e8ea0" stroke-width="1.4" stroke-dasharray="5 4"/>
<line x1="700" y1="150" x2="760" y2="115" stroke="#10a37f" stroke-width="2.4"/>
<line x1="700" y1="150" x2="880" y2="190" stroke="#840132" stroke-width="2.4"/>
<circle cx="700" cy="150" r="9" fill="#2e95d3"/>
<text x="712" y="140" font-family="Lato, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#000">f(A)</text>
<circle cx="760" cy="115" r="9" fill="#10a37f"/>
<text x="772" y="105" font-family="Lato, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#000">f(P)</text>
<circle cx="880" cy="190" r="9" fill="#840132"/>
<text x="892" y="180" font-family="Lato, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#000">f(N)</text>
<text x="780" y="255" font-family="Lato, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#404452" text-anchor="middle">training pulls f(P) in and pushes f(N) out, by a margin α</text>
<text x="780" y="45" font-family="Lato, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#000" text-anchor="middle">encoding space</text>
</svg>
