<path d="M55 95 C55 20, 680 20, 680 88" fill="none" stroke="#840132" stroke-width="2.4"/>
<path d="M674 80 L680 92 L686 80 z" fill="#840132"/>
<text x="500" y="196" font-family="Lato, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#840132" text-anchor="middle">shortcut: a[l] skips ahead and is added before the last ReLU</text>
<text x="540" y="162" font-family="Lato, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#404452" text-anchor="middle">z[l+2]</text>
