<rect x="10" y="170" width="150" height="46" rx="8" fill="#ffffff" stroke="#404452" stroke-width="1.8"/>
<text x="85.0" y="199" font-family="Lato, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#000" text-anchor="middle">audio</text>
<line x1="160" y1="193" x2="322" y2="193" stroke="#404452" stroke-width="1.8"/>
<path d="M321 188 L330 193 L321 198 z" fill="#404452"/>
