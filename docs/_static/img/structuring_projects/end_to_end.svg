<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 250" role="img" aria-labelledby="t d">
<title id="t">A pipeline versus end-to-end learning for speech recognition</title>
<desc id="d">Top: audio goes through hand-designed features, then phonemes, then words, then the transcript. Bottom: one neural network maps audio directly to the transcript.</desc>
<text x="10" y="26" font-family="Lato, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#000">Pipeline</text>
<text x="10" y="156" font-family="Lato, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#000">End-to-end</text>
<rect x="10" y="40" width="150" height="46" rx="8" fill="#ffffff" stroke="#404452" stroke-width="1.8"/>
<text x="85.0" y="69" font-family="Lato, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#000" text-anchor="middle">audio</text>
