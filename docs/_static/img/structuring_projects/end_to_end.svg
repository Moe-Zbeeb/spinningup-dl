<path d="M181 58 L190 63 L181 68 z" fill="#404452"/>
<rect x="190" y="40" width="150" height="46" rx="8" fill="#eef6fb" stroke="#404452" stroke-width="1.8"/>
<text x="265.0" y="69" font-family="Lato, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#000" text-anchor="middle">features (MFCC)</text>
<line x1="340" y1="63" x2="362" y2="63" stroke="#404452" stroke-width="1.8"/>
<path d="M361 58 L370 63 L361 68 z" fill="#404452"/>
<rect x="370" y="40" width="150" height="46" rx="8" fill="#eef6fb" stroke="#404452" stroke-width="1.8"/>
<text x="445.0" y="69" font-family="Lato, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#000" text-anchor="middle">phonemes</text>
<line x1="520" y1="63" x2="542" y2="63" stroke="#404452" stroke-width="1.8"/>
<path d="M541 58 L550 63 L541 68 z" fill="#404452"/>
<rect x="550" y="40" width="150" height="46" rx="8" fill="#eef6fb" stroke="#404452" stroke-width="1.8"/>
<text x="625.0" y="69" font-family="Lato, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#000" text-anchor="middle">words</text>
