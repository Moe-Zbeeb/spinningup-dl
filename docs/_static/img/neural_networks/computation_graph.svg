<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 610" role="img" aria-labelledby="t d">
<title id="t">Local and global gradients in the computation graph of logistic regression</title>
<desc id="d">Three bands. The forward pass computes z from w, x, and b, then a equals sigma of z, then the loss. Under each node, a local gradient box gives the derivative of that node alone: dz/dw equals x and dz/db equals 1, da/dz equals a times one minus a, and dL/da. Below, global gradient boxes flow backward from the loss, each the upstream global gradient times the local gradient: dL/da, then dL/dz equals a minus y, then dL/dw equals x times a minus y and dL/db equals a minus y.</desc>
<rect x="8" y="30" width="1084" height="210" rx="12" fill="#2e95d3" fill-opacity="0.05"/>
<text x="22" y="51" font-family="Lato, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#2e95d3">Forward pass: compute the values</text>
<rect x="8" y="252" width="1084" height="96" rx="12" fill="#e86c09" fill-opacity="0.05"/>
<text x="22" y="273" font-family="Lato, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#e86c09">Local gradients: each node on its own</text>
<rect x="8" y="360" width="1084" height="192" rx="12" fill="#840132" fill-opacity="0.05"/>
<text x="1078" y="540" font-family="Lato, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#840132" text-anchor="end">Global gradients: ∂ℒ / ∂(variable) = upstream global × local</text>
<rect x="30" y="80" width="60" height="40" rx="9" fill="#ffffff" stroke="#404452" stroke-width="2"/>
<text x="60.0" y="107.0" font-family="STIX Two Text, Latin Modern Roman, Times New Roman, Times, serif" font-style="italic" font-size="20" fill="#000" text-anchor="middle">w</text>
<rect x="30" y="140" width="60" height="40" rx="9" fill="#ffffff" stroke="#404452" stroke-width="2"/>
<text x="60.0" y="167.0" font-family="STIX Two Text, Latin Modern Roman, Times New Roman, Times, serif" font-style="italic" font-size="20" fill="#000" text-anchor="middle">x</text>
<rect x="30" y="200" width="60" height="40" rx="9" fill="#ffffff" stroke="#404452" stroke-width="2"/>
<text x="60.0" y="227.0" font-family="STIX Two Text, Latin Modern Roman, Times New Roman, Times, serif" font-style="italic" font-size="20" fill="#000" text-anchor="middle">b</text>
<rect x="220" y="140" width="180" height="40" rx="9" fill="#ffffff" stroke="#404452" stroke-width="2"/>
<text x="310.0" y="167.0" font-family="STIX Two Text, Latin Modern Roman, Times New Roman, Times, serif" font-style="italic" font-size="20" fill="#000" text-anchor="middle">z = w<tspan font-size='13' dy='-8'>⊤</tspan><tspan dy='8'>x + b</tspan></text>
<rect x="520" y="140" width="140" height="40" rx="9" fill="#ffffff" stroke="#404452" stroke-width="2"/>
<text x="590.0" y="167.0" font-family="STIX Two Text, Latin Modern Roman, Times New Roman, Times, serif" font-style="italic" font-size="20" fill="#000" text-anchor="middle">a = σ(z)</text>
<rect x="870" y="140" width="140" height="40" rx="9" fill="#ffffff" stroke="#404452" stroke-width="2"/>
<text x="940.0" y="167.0" font-family="STIX Two Text, Latin Modern Roman, Times New Roman, Times, serif" font-style="italic" font-size="20" fill="#000" text-anchor="middle">ℒ(a, y)</text>
<rect x="910" y="60" width="60" height="36" rx="9" fill="#ffffff" stroke="#404452" stroke-width="2"/>
<text x="940.0" y="84.3" font-family="STIX Two Text, Latin Modern Roman, Times New Roman, Times, serif" font-style="italic" font-size="18" fill="#000" text-anchor="middle">y</text>
<line x1="90" y1="100" x2="210.7" y2="148.3" stroke="#2e95d3" stroke-width="2.2"/>
<path d="M220.0 152.0 L208.9 152.9 L212.6 143.6 z" fill="#2e95d3"/>
<line x1="90" y1="160" x2="210.0" y2="160.0" stroke="#2e95d3" stroke-width="2.2"/>
<path d="M220.0 160.0 L210.0 165.0 L210.0 155.0 z" fill="#2e95d3"/>
<line x1="90" y1="220" x2="210.7" y2="171.7" stroke="#2e95d3" stroke-width="2.2"/>
<path d="M220.0 168.0 L212.6 176.4 L208.9 167.1 z" fill="#2e95d3"/>
<line x1="400" y1="160" x2="510.0" y2="160.0" stroke="#2e95d3" stroke-width="2.2"/>
<path d="M520.0 160.0 L510.0 165.0 L510.0 155.0 z" fill="#2e95d3"/>
<line x1="660" y1="160" x2="860.0" y2="160.0" stroke="#2e95d3" stroke-width="2.2"/>
<path d="M870.0 160.0 L860.0 165.0 L860.0 155.0 z" fill="#2e95d3"/>
<line x1="940" y1="96" x2="940.0" y2="130.0" stroke="#2e95d3" stroke-width="2.2"/>
<path d="M940.0 140.0 L935.0 130.0 L945.0 130.0 z" fill="#2e95d3"/>
<rect x="205" y="286" width="210" height="50" rx="9" fill="#fdf0e4" stroke="#e86c09" stroke-width="2"/>
<text x="310.0" y="316.9" font-family="STIX Two Text, Latin Modern Roman, Times New Roman, Times, serif" font-style="italic" font-size="17" fill="#000" text-anchor="middle">∂z/∂w = x,  ∂z/∂b = 1</text>
<rect x="490" y="286" width="200" height="50" rx="9" fill="#fdf0e4" stroke="#e86c09" stroke-width="2"/>
<text x="590.0" y="316.9" font-family="STIX Two Text, Latin Modern Roman, Times New Roman, Times, serif" font-style="italic" font-size="17" fill="#000" text-anchor="middle">∂a/∂z = a(1 − a)</text>
<rect x="790" y="286" width="290" height="50" rx="9" fill="#fdf0e4" stroke="#e86c09" stroke-width="2"/>
<text x="935.0" y="316.9" font-family="STIX Two Text, Latin Modern Roman, Times New Roman, Times, serif" font-style="italic" font-size="17" fill="#000" text-anchor="middle">∂ℒ/∂a = −y/a + (1 − y)/(1 − a)</text>
<line x1="310" y1="180" x2="310" y2="286" stroke="#e86c09" stroke-width="1.6" stroke-dasharray="3 3"/>
<line x1="590" y1="180" x2="590" y2="286" stroke="#e86c09" stroke-width="1.6" stroke-dasharray="3 3"/>
<line x1="940" y1="180" x2="940" y2="286" stroke="#e86c09" stroke-width="1.6" stroke-dasharray="3 3"/>
<rect x="690" y="400" width="300" height="64" rx="9" fill="#fbeef2" stroke="#840132" stroke-width="2" stroke-dasharray="7 4"/>
<text x="840.0" y="426.4" font-family="STIX Two Text, Latin Modern Roman, Times New Roman, Times, serif" font-style="italic" font-size="17" fill="#000" text-anchor="middle">∂ℒ/∂a = 1 · ∂ℒ/∂a</text>
<text x="840.0" y="449.4" font-family="STIX Two Text, Latin Modern Roman, Times New Roman, Times, serif" font-style="italic" font-size="17" fill="#000" text-anchor="middle">= −y/a + (1 − y)/(1 − a)</text>
<rect x="370" y="400" width="250" height="64" rx="9" fill="#fbeef2" stroke="#840132" stroke-width="2" stroke-dasharray="7 4"/>
<text x="495.0" y="426.4" font-family="STIX Two Text, Latin Modern Roman, Times New Roman, Times, serif" font-style="italic" font-size="17" fill="#000" text-anchor="middle">∂ℒ/∂z = ∂ℒ/∂a · ∂a/∂z</text>
<text x="495.0" y="449.4" font-family="STIX Two Text, Latin Modern Roman, Times New Roman, Times, serif" font-style="italic" font-size="17" fill="#000" text-anchor="middle">= a − y</text>
<rect x="30" y="400" width="250" height="64" rx="9" fill="#fbeef2" stroke="#840132" stroke-width="2" stroke-dasharray="7 4"/>
<text x="155.0" y="426.4" font-family="STIX Two Text, Latin Modern Roman, Times New Roman, Times, serif" font-style="italic" font-size="17" fill="#000" text-anchor="middle">∂ℒ/∂w = ∂ℒ/∂z · ∂z/∂w</text>
<text x="155.0" y="449.4" font-family="STIX Two Text, Latin Modern Roman, Times New Roman, Times, serif" font-style="italic" font-size="17" fill="#000" text-anchor="middle">= x (a − y)</text>
<rect x="30" y="478" width="250" height="64" rx="9" fill="#fbeef2" stroke="#840132" stroke-width="2" stroke-dasharray="7 4"/>
<text x="155.0" y="504.4" font-family="STIX Two Text, Latin Modern Roman, Times New Roman, Times, serif" font-style="italic" font-size="17" fill="#000" text-anchor="middle">∂ℒ/∂b = ∂ℒ/∂z · ∂z/∂b</text>
<text x="155.0" y="527.5" font-family="STIX Two Text, Latin Modern Roman, Times New Roman, Times, serif" font-style="italic" font-size="17" fill="#000" text-anchor="middle">= a − y</text>
<line x1="690" y1="432" x2="630.0" y2="432.0" stroke="#840132" stroke-width="2.2" stroke-dasharray="7 5"/>
<path d="M620.0 432.0 L630.0 427.0 L630.0 437.0 z" fill="#840132"/>
<line x1="370" y1="432" x2="290.0" y2="432.0" stroke="#840132" stroke-width="2.2" stroke-dasharray="7 5"/>
<path d="M280.0 432.0 L290.0 427.0 L290.0 437.0 z" fill="#840132"/>
<line x1="370" y1="444" x2="288.1" y2="502.2" stroke="#840132" stroke-width="2.2" stroke-dasharray="7 5"/>
<path d="M280.0 508.0 L285.3 498.1 L291.0 506.3 z" fill="#840132"/>
<line x1="940" y1="336" x2="905.3" y2="391.5" stroke="#e86c09" stroke-width="1.8"/>
<path d="M900.0 400.0 L901.1 388.9 L909.5 394.2 z" fill="#e86c09"/>
<line x1="590" y1="336" x2="536.8" y2="392.7" stroke="#e86c09" stroke-width="1.8"/>
<path d="M530.0 400.0 L533.2 389.3 L540.5 396.1 z" fill="#e86c09"/>
<line x1="250" y1="336" x2="206.2" y2="392.1" stroke="#e86c09" stroke-width="1.8"/>
<path d="M200.0 400.0 L202.2 389.0 L210.1 395.2 z" fill="#e86c09"/>
<line x1="90" y1="582" x2="130" y2="582" stroke="#2e95d3" stroke-width="2.2"/>
<text x="138" y="587" font-family="Lato, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#404452">forward pass</text>
<rect x="270" y="573" width="34" height="18" rx="4" fill="#fdf0e4" stroke="#e86c09" stroke-width="1.8"/>
<text x="312" y="587" font-family="Lato, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#404452">local gradient: depends only on that node</text>
<line x1="660" y1="582" x2="700" y2="582" stroke="#840132" stroke-width="2.2" stroke-dasharray="7 5"/>
<text x="708" y="587" font-family="Lato, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#404452">global gradient: flows back from the loss</text>
</svg>
