<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" role="img" aria-labelledby="t d">
<title id="t">Computation graph of logistic regression</title>
<desc id="d">Inputs w, x, and b feed z equals w transpose x plus b, which feeds a equals sigma of z, which feeds the loss L of a and y. Solid blue arrows run forward from left to right. Dashed maroon arrows run backward from the loss, labeled with the derivative of the loss with respect to a, the derivative of a with respect to z, dz equals a minus y, dw equals x dz, and db equals dz.</desc>
<rect x="30" y="60" width="60" height="44" rx="9" fill="#ffffff" stroke="#404452" stroke-width="2"/>
<text x="60.0" y="89.0" font-family="STIX Two Text, Latin Modern Roman, Times New Roman, Times, serif" font-style="italic" font-size="21" fill="#000" text-anchor="middle">w</text>
<rect x="30" y="158" width="60" height="44" rx="9" fill="#ffffff" stroke="#404452" stroke-width="2"/>
<text x="60.0" y="187.0" font-family="STIX Two Text, Latin Modern Roman, Times New Roman, Times, serif" font-style="italic" font-size="21" fill="#000" text-anchor="middle">x</text>
<rect x="30" y="256" width="60" height="44" rx="9" fill="#ffffff" stroke="#404452" stroke-width="2"/>
<text x="60.0" y="285.0" font-family="STIX Two Text, Latin Modern Roman, Times New Roman, Times, serif" font-style="italic" font-size="21" fill="#000" text-anchor="middle">b</text>
<rect x="200" y="158" width="170" height="44" rx="9" fill="#ffffff" stroke="#404452" stroke-width="2"/>
<text x="285.0" y="187.0" font-family="STIX Two Text, Latin Modern Roman, Times New Roman, Times, serif" font-style="italic" font-size="21" fill="#000" text-anchor="middle">z = w<tspan font-size='14' dy='-8'>⊤</tspan><tspan dy='8'>x + b</tspan></text>
<rect x="490" y="158" width="130" height="44" rx="9" fill="#ffffff" stroke="#404452" stroke-width="2"/>
<text x="555.0" y="187.0" font-family="STIX Two Text, Latin Modern Roman, Times New Roman, Times, serif" font-style="italic" font-size="21" fill="#000" text-anchor="middle">a = σ(z)</text>
<rect x="800" y="158" width="130" height="44" rx="9" fill="#ffffff" stroke="#404452" stroke-width="2"/>
<text x="865.0" y="187.0" font-family="STIX Two Text, Latin Modern Roman, Times New Roman, Times, serif" font-style="italic" font-size="21" fill="#000" text-anchor="middle">ℒ(a, y)</text>
<rect x="835" y="290" width="60" height="44" rx="9" fill="#ffffff" stroke="#404452" stroke-width="2"/>
<text x="865.0" y="319.0" font-family="STIX Two Text, Latin Modern Roman, Times New Roman, Times, serif" font-style="italic" font-size="21" fill="#000" text-anchor="middle">y</text>
<line x1="90" y1="82" x2="193.0" y2="166.3" stroke="#2e95d3" stroke-width="2.2"/>
<path d="M200.0 172.0 L189.1 169.5 L195.4 161.8 z" fill="#2e95d3"/>
<line x1="90" y1="180" x2="191.0" y2="180.0" stroke="#2e95d3" stroke-width="2.2"/>
<path d="M200.0 180.0 L190.0 185.0 L190.0 175.0 z" fill="#2e95d3"/>
<line x1="90" y1="278" x2="193.0" y2="193.7" stroke="#2e95d3" stroke-width="2.2"/>
<path d="M200.0 188.0 L195.4 198.2 L189.1 190.5 z" fill="#2e95d3"/>
<line x1="370" y1="180" x2="481.0" y2="180.0" stroke="#2e95d3" stroke-width="2.2"/>
<path d="M490.0 180.0 L480.0 185.0 L480.0 175.0 z" fill="#2e95d3"/>
<line x1="620" y1="180" x2="791.0" y2="180.0" stroke="#2e95d3" stroke-width="2.2"/>
<path d="M800.0 180.0 L790.0 185.0 L790.0 175.0 z" fill="#2e95d3"/>
<line x1="865" y1="290" x2="865.0" y2="211.0" stroke="#2e95d3" stroke-width="2.2"/>
<path d="M865.0 202.0 L870.0 212.0 L860.0 212.0 z" fill="#2e95d3"/>
<path d="M800 166 Q710 95 627.1 160.4" fill="none" stroke="#840132" stroke-width="2.2" stroke-dasharray="7 5"/>
<path d="M620.0 166.0 L624.8 155.9 L630.9 163.7 z" fill="#840132"/>
<text x="710" y="116" font-family="STIX Two Text, Latin Modern Roman, Times New Roman, Times, serif" font-style="italic" font-size="18" fill="#840132" text-anchor="middle">∂ℒ / ∂a = −y / a + (1 − y) / (1 − a)</text>
<path d="M490 166 Q430 105 376.3 159.6" fill="none" stroke="#840132" stroke-width="2.2" stroke-dasharray="7 5"/>
<path d="M370.0 166.0 L373.4 155.4 L380.6 162.4 z" fill="#840132"/>
<text x="430" y="124" font-family="STIX Two Text, Latin Modern Roman, Times New Roman, Times, serif" font-style="italic" font-size="18" fill="#840132" text-anchor="middle">∂a / ∂z = a(1 − a)</text>
<text x="285" y="236" font-family="STIX Two Text, Latin Modern Roman, Times New Roman, Times, serif" font-style="italic" font-size="19" fill="#840132" text-anchor="middle">dz = a − y</text>
<path d="M212 158 Q160 70 99.0 70.0" fill="none" stroke="#840132" stroke-width="2.2" stroke-dasharray="7 5"/>
<path d="M90.0 70.0 L100.0 65.0 L100.0 75.0 z" fill="#840132"/>
<text x="155" y="52" font-family="STIX Two Text, Latin Modern Roman, Times New Roman, Times, serif" font-style="italic" font-size="18" fill="#840132" text-anchor="middle">dw = x dz</text>
<path d="M212 202 Q160 290 99.0 290.0" fill="none" stroke="#840132" stroke-width="2.2" stroke-dasharray="7 5"/>
<path d="M90.0 290.0 L100.0 285.0 L100.0 295.0 z" fill="#840132"/>
<text x="155" y="328" font-family="STIX Two Text, Latin Modern Roman, Times New Roman, Times, serif" font-style="italic" font-size="18" fill="#840132" text-anchor="middle">db = dz</text>
<line x1="250" y1="360" x2="290" y2="360" stroke="#2e95d3" stroke-width="2.2"/>
<text x="298" y="365" font-family="Lato, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#404452">forward pass: compute the values</text>
<line x1="560" y1="360" x2="600" y2="360" stroke="#840132" stroke-width="2.2" stroke-dasharray="7 5"/>
<text x="608" y="365" font-family="Lato, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#404452">backward pass: chain rule</text>
</svg>
